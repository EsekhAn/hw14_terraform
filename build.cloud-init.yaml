#!/bin/bash
set -e

export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y openjdk-17-jdk maven git awscli

cd /home/ubuntu

git clone https://github.com/EsekhAn/docker_compose.git app
cd app
mvn clean package -DskipTests

WAR=$(find target -name "*.war" | head -1)
echo "WAR found: $WAR"

aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$WAR" s3://java-build-artifacts/hello.war

echo "BUILD COMPLETE" > /tmp/build.status