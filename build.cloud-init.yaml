#cloud-config
datasource:
  Ec2:
    strict_id: false
package_update: true
packages:
  - openjdk-17-jdk
  - maven
  - git
  - awscli

runcmd:
  - sudo -u ubuntu bash -c 'cd /home/ubuntu && git clone https://github.com/EsekhAn/docker_compose.git app && cd app && mvn clean package -DskipTests && WAR=$(find target -name "*.war" | head -1) && aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$WAR" s3://java-build-artifacts/hello.war && echo "BUILD COMPLETE" > /tmp/build.status'