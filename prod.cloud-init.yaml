#cloud-config
datasource:
  Ec2:
    strict_id: false
package_update: true
packages:
  - openjdk-17-jdk
  - tomcat9
  - awscli

runcmd:
  - sudo -u ubuntu bash -c 'BUCKET="java-build-artifacts"; cd /home/ubuntu; for i in $(seq 1 30); do if aws --endpoint-url=https://storage.yandexcloud.net s3 cp "s3://$BUCKET/hello.war" /tmp/hello.war; then echo "WAR downloaded"; break; fi; echo "Waiting for WAR... attempt $i"; sleep 20; done; if [ ! -f /tmp/hello.war ]; then echo "ERROR: WAR not found" >&2; exit 1; fi; sudo cp /tmp/hello.war /var/lib/tomcat9/webapps/hello.war; sudo systemctl restart tomcat9; sudo systemctl enable tomcat9; echo "PROD DEPLOY COMPLETE" > /tmp/prod.status'