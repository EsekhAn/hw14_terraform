#cloud-config
package_update: true
packages:
  - openjdk-17-jdk
  - tomcat9
  - awscli

write_files:
  - path: /home/ubuntu/prod.sh
    owner: ubuntu:ubuntu
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      BUCKET="${bucket}"

      cd /home/ubuntu
      for i in {1..30}; do
        if aws --endpoint-url=https://storage.yandexcloud.net \
               s3 cp "s3://$BUCKET/hello.war" /tmp/hello.war; then
          echo "WAR downloaded"
          break
        fi
        echo "Waiting for WAR... attempt $i"
        sleep 20
      done

      if [ ! -f /tmp/hello.war ]; then
        echo "ERROR: WAR not found in bucket" >&2
        exit 1
      fi

      sudo cp /tmp/hello.war /var/lib/tomcat9/webapps/hello.war

      sudo systemctl restart tomcat9
      sudo systemctl enable tomcat9

      echo "PROD DEPLOY COMPLETE" > /tmp/prod.status

runcmd:
  - su - ubuntu -c 'bash /home/ubuntu/prod.sh'
